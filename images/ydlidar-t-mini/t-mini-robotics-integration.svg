<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">YDLIDAR T-mini robotics integration</title>
  <desc id="desc">Diagram showing the lidar, ROS 2 driver, TF, and downstream robot applications.</desc>
  <defs>
    <style>
      .bg { fill: #f7f6f2; }
      .panel { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 18; ry: 18; }
      .sensor { fill: #e9f5ff; }
      .driver { fill: #fef3c7; }
      .stack { fill: #e8f7ea; }
      .tf { fill: #fce7f3; }
      .note { fill: #eef2ff; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #374151; }
      .label { font: 700 20px Arial, sans-serif; fill: #111827; }
      .text { font: 400 16px Arial, sans-serif; fill: #374151; }
      .small { font: 400 14px Arial, sans-serif; fill: #4b5563; }
      .arrow { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 10 8; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#111827"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="520"/>

  <text class="title" x="50" y="50">YDLIDAR T-mini for Robotics</text>
  <text class="subtitle" x="50" y="78">Use the vendor Tmini profile, correct TF, then feed /scan into navigation, SLAM, and debugging tools.</text>

  <rect class="panel sensor" x="50" y="120" width="230" height="120" rx="18" ry="18"/>
  <text class="label" x="80" y="165">T-mini Lidar</text>
  <text class="text" x="80" y="195">5 V power</text>
  <text class="text" x="80" y="220">3.3 V UART / USB adapter</text>

  <rect class="panel driver" x="350" y="105" width="310" height="150" rx="18" ry="18"/>
  <text class="label" x="380" y="150">ydlidar_ros2_driver</text>
  <text class="text" x="380" y="182">`params/Tmini.yaml` or your custom copy</text>
  <text class="text" x="380" y="208">Publishes `/scan`</text>
  <text class="text" x="380" y="234">Services: `/start_scan`, `/stop_scan`</text>

  <rect class="panel tf" x="350" y="300" width="310" height="135" rx="18" ry="18"/>
  <text class="label" x="380" y="345">Robot TF</text>
  <text class="text" x="380" y="377">Publish the real</text>
  <text class="text" x="380" y="402">`base_link -> laser_frame`</text>
  <text class="small" x="380" y="426">Prefer URDF or your own static transform.</text>

  <rect class="panel stack" x="750" y="85" width="280" height="95" rx="18" ry="18"/>
  <text class="label" x="780" y="125">RViz</text>
  <text class="text" x="780" y="154">Check orientation and self-hits</text>

  <rect class="panel stack" x="750" y="205" width="280" height="95" rx="18" ry="18"/>
  <text class="label" x="780" y="245">SLAM Toolbox</text>
  <text class="text" x="780" y="274">Mapping and localization</text>

  <rect class="panel stack" x="750" y="325" width="280" height="95" rx="18" ry="18"/>
  <text class="label" x="780" y="365">Nav2 / Avoidance</text>
  <text class="text" x="780" y="394">Obstacle layer and local planning</text>

  <rect class="panel note" x="50" y="300" width="230" height="135" rx="18" ry="18"/>
  <text class="label" x="80" y="345">Common gotchas</text>
  <text class="small" x="80" y="373">Weak 5 V power</text>
  <text class="small" x="80" y="396">Wrong Tmini profile</text>
  <text class="small" x="80" y="419">Bad TF or mirrored scan</text>

  <path class="arrow" d="M280 180 L350 180"/>
  <path class="arrow" d="M660 150 L750 130"/>
  <path class="arrow" d="M660 190 L750 252"/>
  <path class="arrow" d="M660 225 L750 372"/>
  <path class="arrow dash" d="M505 255 L505 300"/>
</svg>
