<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Mohammad Robot logo mark</title>
  <desc id="desc">Rounded square emblem with MR monogram and robotics ring motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <circle cx="128" cy="128" r="78" fill="none" stroke="#e2e8f0" stroke-width="12" opacity="0.95"/>
    <circle cx="128" cy="44" r="8" fill="#67e8f9"/>
    <circle cx="128" cy="212" r="8" fill="#67e8f9"/>
    <circle cx="44" cy="128" r="8" fill="#67e8f9"/>
    <circle cx="212" cy="128" r="8" fill="#67e8f9"/>
    <circle cx="70" cy="70" r="6" fill="#94a3b8"/>
    <circle cx="186" cy="70" r="6" fill="#94a3b8"/>
    <circle cx="70" cy="186" r="6" fill="#94a3b8"/>
    <circle cx="186" cy="186" r="6" fill="#94a3b8"/>
  </g>

  <path
    d="M 66 170 L 66 88 L 97 136 L 128 88 L 128 170
       M 146 170 L 146 88 L 176 88
       Q 198 88 198 109
       Q 198 130 176 130
       L 160 130 L 198 170"
    fill="none"
    stroke="#f8fafc"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
