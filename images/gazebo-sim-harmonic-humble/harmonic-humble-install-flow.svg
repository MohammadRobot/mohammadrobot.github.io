<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Install flow for Gazebo Harmonic with ROS 2 Humble</title>
  <desc id="desc">Step diagram showing repository setup, package install, rosdep setup, optional gz_ros2_control source build, and validation commands.</desc>
  <defs>
    <style>
      .bg { fill: #f6f5f1; }
      .title { font: 700 34px "Ubuntu", "DejaVu Sans", sans-serif; fill: #111827; }
      .subtitle { font: 500 18px "Ubuntu", "DejaVu Sans", sans-serif; fill: #374151; }
      .label { font: 700 18px "Ubuntu", "DejaVu Sans", sans-serif; fill: #111827; }
      .text { font: 500 14px "Ubuntu", "DejaVu Sans", sans-serif; fill: #1f2937; }
      .stepA { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
      .stepB { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
      .stepC { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2.5; }
      .stepD { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; }
      .stepE { fill: #fee2e2; stroke: #dc2626; stroke-width: 2.5; }
      .arrow { stroke: #111827; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#111827"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="620"/>
  <text class="title" x="55" y="62">Install Flow: Harmonic + Humble</text>
  <text class="subtitle" x="55" y="93">Use this order to avoid package conflicts and missing rosdep keys.</text>

  <rect class="stepA" x="55" y="150" width="210" height="165" rx="20"/>
  <text class="label" x="80" y="188">1. Add Repo</text>
  <text class="text" x="80" y="222">OSRF keyring</text>
  <text class="text" x="80" y="247">gazebo-stable.list</text>
  <text class="text" x="80" y="272">apt-get update</text>

  <rect class="stepB" x="285" y="150" width="210" height="165" rx="20"/>
  <text class="label" x="310" y="188">2. Install Base</text>
  <text class="text" x="310" y="222">gz-harmonic</text>
  <text class="text" x="310" y="247">ros-humble-ros-gzharmonic</text>
  <text class="text" x="310" y="272">source /opt/ros/humble</text>

  <rect class="stepC" x="515" y="150" width="210" height="165" rx="20"/>
  <text class="label" x="540" y="188">3. rosdep Rules</text>
  <text class="text" x="540" y="222">osrf-rosdep list file</text>
  <text class="text" x="540" y="247">rosdep update</text>
  <text class="text" x="540" y="272">rosdep resolve gz-harmonic</text>

  <rect class="stepD" x="745" y="150" width="210" height="165" rx="20"/>
  <text class="label" x="770" y="188">4. ros2_control</text>
  <text class="text" x="770" y="222">clone gz_ros2_control</text>
  <text class="text" x="770" y="247">export GZ_VERSION=harmonic</text>
  <text class="text" x="770" y="272">colcon build</text>

  <rect class="stepE" x="975" y="150" width="170" height="165" rx="20"/>
  <text class="label" x="995" y="188">5. Verify</text>
  <text class="text" x="995" y="222">gz sim --versions</text>
  <text class="text" x="995" y="247">ros2 pkg list</text>
  <text class="text" x="995" y="272">ros2 topic list</text>

  <rect class="stepA" x="130" y="370" width="940" height="180" rx="20"/>
  <text class="label" x="160" y="407">Common Pitfalls</text>
  <text class="text" x="160" y="438">Default Humble Gazebo stack conflicts: remove incompatible `ros-humble-ros-gz*` packages before mixing Harmonic variants.</text>
  <text class="text" x="160" y="466">If `controller_manager` reports missing clock, bridge `/clock@rosgraph_msgs/msg/Clock[gz.msgs.Clock`.</text>
  <text class="text" x="160" y="494">If `gz_ros2_control` does not load, verify both URDF `<ros2_control>` and Gazebo plugin block exist.</text>
  <text class="text" x="160" y="522">Always source both workspaces in run terminals: `/opt/ros/humble` and `~/gz_ros2_control_ws/install`.</text>

  <path class="arrow" d="M265 232 L285 232"/>
  <path class="arrow" d="M495 232 L515 232"/>
  <path class="arrow" d="M725 232 L745 232"/>
  <path class="arrow" d="M955 232 L975 232"/>
  <path class="arrow" d="M1060 315 C1060 340, 1020 360, 980 370"/>
</svg>
